name: PDF recovery

"on":
  workflow_dispatch:
  push:
    paths:
      - 'submission-version-b2/**'
      - '.github/workflows/b2r.yml'

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify delivered files
        working-directory: submission-version-b2
        run: sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Book-PDF-B2
          path: submission-version-b2
