name: Publish book preview

on:
  push:
    branches: [main]
    paths:
      - submission-version-b12-html/Maltu_Book_Easy.html
      - submission-version-b12-html/Maltu_Book_28p.html
      - .github/workflows/book-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare book files
        run: |
          mkdir -p .book-site
          cp submission-version-b12-html/Maltu_Book_Easy.html .book-site/index.html
          cp submission-version-b12-html/Maltu_Book_28p.html .book-site/viewer.html
          touch .book-site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload book
        uses: actions/upload-pages-artifact@v3
        with:
          path: .book-site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published HTML
        env:
          BOOK_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          url = os.environ['BOOK_URL']
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=25) as response:
                      body = response.read().decode()
                      assert response.status == 200
                      assert response.headers.get_content_type() == 'text/html'
                      assert body.count('data:image/webp;base64,') == 28
                  print('BOOK_PREVIEW_OK', url, 'HTML, 28 embedded pages')
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
